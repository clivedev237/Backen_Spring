server:
  # Render impose le port via la variable d'environnement PORT
  port: ${PORT:8080}

spring:
  application:
    name: vora-reservation-service

  datasource:
    # Base PostgreSQL UNIQUE et PARTAGÉE avec Django (Geo) et Node (Auth & Payment) —
    # voir VORA_Shared_Database_Guide.md. Il n'y a PAS de schéma dédié par service :
    # toutes les tables vivent dans le schéma "public" de la même instance Render.
    # SPRING_DATASOURCE_URL et DATABASE_URL (Django/Node) pointent vers la même instance.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vora?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:vora}
    password: ${SPRING_DATASOURCE_PASSWORD:vora}

  jpa:
    hibernate:
      ddl-auto: validate   # le schéma est piloté par Flyway, jamais par Hibernate (règle guide §2.3)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0   # CORRECTIF : baseline par défaut = 1, identique à V1__init_schema.sql,
      # ce qui faisait sauter son exécution (tables jamais créées). Avec 0,
    # le point de baseline est AVANT V1, qui s'exécute donc réellement.
    # Flyway ne gère QUE ses propres tables (turn, reservation_offer, payment_reference,
    # reservations) dans le schéma public partagé ; il ne touche jamais aux tables
    # possédées par Django/Node (users, clients, roles, etc. — voir guide §2 et §10).

# URLs des autres microservices VORA, injectées par variables d'environnement Render
vora:
  geo:
    base-url: ${VORA_GEO_BASE_URL:http://localhost:8081}
    # Timeouts courts (cadrage §9.2) : Django Geo est appelé de façon synchrone
    # à la création de chaque réservation, il ne doit jamais bloquer longtemps.
    connect-timeout-ms: ${VORA_GEO_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${VORA_GEO_READ_TIMEOUT_MS:3000}
  auth-payment:
    base-url: ${VORA_AUTH_PAYMENT_BASE_URL:http://localhost:8082}
  matching:
    offer-ttl-minutes: 5   # durée de validité d'une offre chauffeur (confirmé)
  turn:
    max-capacity: 4
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.vora.reservation: INFO